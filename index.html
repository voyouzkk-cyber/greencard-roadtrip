<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--bg:#f5f1e8;--card:#fff;--ink:#1f2a37;--sub:#4b5563;--pri:#1d4e89;--ok:#1f7a4d;--okbg:#e3f4ea;--bad:#b42318;--badbg:#fdecea;--line:#d8d2c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;font-size:19px;line-height:1.55}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding:calc(var(--sat) + 12px) calc(env(safe-area-inset-right) + 16px) calc(var(--sab) + 24px) calc(env(safe-area-inset-left) + 16px)}
h1{font-size:26px;margin:4px 0 4px}h2{font-size:23px;margin:6px 0}
.sub{color:var(--sub);font-size:17px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin:12px 0}
.btn{display:block;width:100%;min-height:60px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:16px;font-size:20px;padding:12px 16px;margin:10px 0;text-align:left;cursor:pointer;font-family:inherit}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri);text-align:center;font-weight:600}
.btn.ghost{text-align:center}
.btn.ok{background:var(--okbg);border-color:var(--ok);color:#0f4d2f;font-weight:600}
.btn.bad{background:var(--badbg);border-color:var(--bad);color:#7a1a12}
.btn:disabled{opacity:1}
.bi{display:flex;align-items:flex-start;gap:10px}.bi .tx{flex:1}
.qtx{font-size:24px;font-weight:700;line-height:1.45}.opt .tx{flex:1}.mk{font-weight:800;padding-top:10px}
.tg{flex:none;min-width:64px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:2px solid #c9d4e5;background:#eef2f8;color:var(--pri);font-size:16px;font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none}
.tg.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.lbl{font-size:16px;color:var(--sub);margin-top:12px}.ans{font-size:20px;font-weight:700;color:#0f4d2f}.exp{font-size:18px}
.opt{display:flex;align-items:center;gap:10px;padding-right:8px;cursor:default}.ot{flex:1;cursor:pointer}.oen{font-size:20px;font-weight:600}.spk{font-size:15px;opacity:.6}.ozh{font-size:17px;color:#6b7280;margin-top:2px}
.rad{flex:none;width:48px;height:48px;border-radius:50%;border:3px solid #9aa5b1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;cursor:pointer}
.rad.f{background:var(--pri);border-color:var(--pri)}.ok .rad.f{background:var(--ok);border-color:var(--ok)}.bad .rad.f{background:var(--bad);border-color:var(--bad)}
.L{flex:none;width:46px;height:46px;border-radius:12px;background:#eef2f8;color:var(--pri);font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center}.ok .L{background:var(--ok);color:#fff}.bad .L{background:var(--bad);color:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-size:17px;min-height:48px;cursor:pointer;font-family:inherit;color:var(--ink)}
.emo{font-size:72px;text-align:center;line-height:1.1;margin:6px 0}
.qen{font-size:24px;font-weight:700;line-height:1.4}
.qzh{font-size:19px;color:var(--sub);margin-top:6px}
.tip{background:#fff7e0;border-radius:14px;padding:12px 14px;font-size:18px;margin-top:10px}
.exp{font-size:18px;margin-top:8px}
.acc{font-size:17px;color:var(--sub);margin-top:6px}
.bar{height:12px;background:#e7e1d3;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
svg text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stop{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:#fff;margin:8px 0;border:2px solid var(--line);font-size:18px}
.stop.cur{border-color:var(--pri)}.stop.lock{opacity:.5}
.big{font-size:40px;font-weight:700;text-align:center}
.tag{display:inline-block;background:#eef2f8;color:var(--pri);border-radius:8px;padding:2px 8px;font-size:16px}
.rad.sq{border-radius:12px}.miss{border-color:var(--ok);border-style:dashed}.miss .ozh::after{content:"  ← 漏选";color:var(--ok);font-weight:700}
.hint{font-size:18px;color:var(--pri);margin:12px 2px 4px;font-weight:600}
.num{flex:none;width:36px;height:36px;border-radius:50%;background:#eef2f8;color:var(--pri);font-weight:800;display:flex;align-items:center;justify-content:center}
.ud{display:flex;flex-direction:column;gap:6px}.mvb{width:56px;height:48px;border-radius:12px;border:2px solid #c9d4e5;background:#eef2f8;color:var(--pri);font-size:22px;font-weight:800;cursor:pointer}.mvb:disabled{opacity:.35}
.key{border-color:#e0b84a}.yr{font-weight:800;font-size:20px;color:var(--pri)}.tl{font-size:18px;margin:6px 0}
.cur{border-color:var(--pri);background:#eef2f8}.info{background:#eef6ff}
.rt{text-align:center;font-weight:700;padding:12px 6px}.rt.k{background:var(--okbg);border-color:var(--ok)}.rt.m{background:#fff7e0;border-color:#e0b84a}.rt.u{background:var(--badbg);border-color:var(--bad)}
.fl{display:block;font-size:17px;color:var(--sub);margin:10px 0}.in{display:block;width:100%;min-height:52px;font-size:19px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;margin-top:4px;background:#fff;color:var(--ink);font-family:inherit}
a{color:var(--pri)}
.hbtn{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;margin:18px 0 0;padding:28px 16px;border-radius:22px;border:0;font-size:30px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.hbtn span{font-size:44px}.hbtn small{font-size:17px;opacity:.85;font-weight:400}.hbtn.learn{background:#1f4e8c}.hbtn.rev{background:#c9792b}.home{padding-top:30px}
html,body{height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
#app{height:100vh;height:-webkit-fill-available;height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:calc(var(--sat) + 6px) calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px);overflow-x:hidden}
#app>.hd{flex:none;padding-bottom:4px}
#app>.sc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:8px}
#app>.ft{flex:none;padding:6px 0 calc(var(--sab) + 10px)}#app>.ft .btn{margin:6px 0}
#app.noft>.sc{padding-bottom:calc(var(--sab) + 10px)}
.qs .card{padding:14px 16px;margin:8px 0}.qs .emo{font-size:40px;margin:0}.qs .qtx{font-size:21px;line-height:1.4}
.qs .btn.opt{min-height:0;padding:8px 10px 8px 14px;margin:7px 0}.qs .oen{font-size:19px}.qs .ozh{font-size:15px}.qs .rad{width:42px;height:42px}
.qs .tip{font-size:16px;padding:8px 12px;margin-top:6px}.qs .exp{font-size:16px;margin-top:4px}.qs .lbl{margin-top:6px;font-size:15px}.qs .tg{min-height:40px}
.qs .chip{min-height:40px;padding:4px 12px;font-size:16px}.qs .hint{font-size:16px;margin:6px 2px 2px}
input,select,textarea{font-size:16px!important}.in{font-size:19px!important}
.home{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:0}
.qs .dim{display:none}.qs.dn .emo{display:none}.qs .card .top .chip{margin:0}
</style></head><body><div id="app"></div>
<script>
const Q=[
[1,"🏛️","What is the form of government of the United States?","美国的政府形式是什么？",["Republic","Constitution-based federal republic","Representative democracy"],["Monarchy","Dictatorship","Communist state"],"美国是共和制：人民选代表来管理国家。","Republic 谐音“瑞趴不离客”：人民（public）选代表来管事。“public 公众”藏在 Republic 里！"],
[2,"📜","What is the supreme law of the land?","美国的最高法律是什么？",["(U.S.) Constitution"],["Declaration of Independence","Bill of Rights","Articles of Confederation"],"宪法是最高法律，所有法律都不能违反它。","“最高法律”= Constitution。拆开记：con（一起）+ stitution（建立）→ 大家一起建立的根本大法，好比中国的“宪法”。"],
[3,"📜","Name one thing the U.S. Constitution does.","说出美国宪法的一项作用。",["Forms the government","Defines powers of government","Defines the parts of government","Protects the rights of the people"],["Collects taxes from states","Elects the president","Names the state capitals"],"宪法建立政府、规定政府权力与组成，并保护人民权利。","宪法三件事，记 F-D-P：Forms（建政府）、Defines（定权力）、Protects（护权利）。最好答：Protects the rights of the people。"],
[4,"👥","The U.S. Constitution starts with the words “We the People.” What does “We the People” mean?","宪法开头“We the People（我们人民）”是什么意思？",["Self-government","Popular sovereignty","Consent of the governed","People should govern themselves","(Example of) social contract"],["The king rules the people","Only rich people can vote","Rule by the military"],"权力来自人民，人民自己管理自己。","We the People = 人民当家 → Self-government（self 自己 + government 管理）。想成“自己管自己”。"],
[5,"✏️","How are changes made to the U.S. Constitution?","如何修改美国宪法？",["Amendments","The amendment process"],["Executive orders","Supreme Court votes","State elections"],"修改宪法要通过“修正案”。","改宪法 = 打补丁 → Amendment。mend 是“修补”（衣服破了 mend 一下），a-mend-ment 就是“修补案”。"],
[6,"🗽","What does the Bill of Rights protect?","《权利法案》保护什么？",["(The basic) rights of Americans","(The basic) rights of people living in the United States"],["The rights of the president","The power of the states","The power of Congress"],"权利法案（宪法前10条修正案）保护人们的基本权利。1789年第一届国会在纽约提出。","Bill of Rights 的关键词就是 Rights：保护的是 rights of Americans。第一届国会在纽约提出它。"],
[7,"🔢","How many amendments does the U.S. Constitution have?","美国宪法有多少条修正案？",["Twenty-seven (27)"],["Ten (10)","Twenty-one (21)","Fifty (50)"],"目前共27条修正案。","27 = 3 × 9，“三九天，宪法补了 27 块补丁”。英文：Twenty-seven。"],
[8,"🔔","Why is the Declaration of Independence important?","《独立宣言》为什么重要？",["It says America is free from British control.","It says all people are created equal.","It identifies inherent rights.","It identifies individual freedoms."],["It created the Supreme Court.","It ended the Civil War.","It made the president a king."],"它宣布脱离英国、人人生而平等、人有天赋权利。","最好说：It says all people are created equal（人人生而平等）。联想“created 造出来就一样”。"],
[9,"📃","What founding document said the American colonies were free from Britain?","哪份建国文件宣告美洲殖民地脱离英国独立？",["Declaration of Independence"],["U.S. Constitution","Bill of Rights","Federalist Papers"],"《独立宣言》，1776年在费城通过。","Declaration = 宣告，Independence = 独立。“得克拉瑞神”宣告独立！费城 1776。"],
[10,"⚖️","Name two important ideas from the Declaration of Independence and the U.S. Constitution.","说出《独立宣言》和宪法中的两个重要理念。",["Equality","Liberty","Social contract","Natural rights","Limited government","Self-government"],["Monarchy and nobility","Communism and one party","Military rule and censorship"],"平等、自由、社会契约、自然权利、有限政府、自治（任选两个）。","两个关键词最好记：Liberty（自由女神 Statue of Liberty 的 Liberty）和 Equality（equal 平等）。"],
[11,"😊","The words “Life, Liberty, and the pursuit of Happiness” are in what founding document?","“生命、自由和追求幸福”出自哪份建国文件？",["Declaration of Independence"],["U.S. Constitution","Bill of Rights","Emancipation Proclamation"],"出自《独立宣言》。","“生命、自由、追求幸福”是独立宣言里最有名的一句。凡是问“哪份文件说了…自由/平等/独立”，大多是 Declaration of Independence。"],
[12,"💰","What is the economic system of the United States?","美国的经济制度是什么？",["Capitalism","Free market economy"],["Socialism","Communism","Planned economy"],"美国实行资本主义 / 自由市场经济。新奥尔良港自古就是自由贸易大港。","美国 = 自由市场 → Capitalism（capital 资本，和“首都 capital”同一个词）。“资本主义”直译。"],
[13,"👨‍⚖️","What is the rule of law?","什么是法治？",["Everyone must follow the law.","Leaders must obey the law.","Government must obey the law.","No one is above the law."],["The president makes all laws.","Only citizens follow the law.","Judges are above the law."],"法治：任何人都不能凌驾于法律之上。","Rule of law 一句话答：No one is above the law（没人在法律之上）。above = 在上面。"],
[14,"📚","Many documents influenced the U.S. Constitution. Name one.","许多文件影响了美国宪法，说出一个。",["Declaration of Independence","Articles of Confederation","Federalist Papers","Anti-Federalist Papers","Virginia Declaration of Rights","Fundamental Orders of Connecticut","Mayflower Compact","Iroquois Great Law of Peace"],["Emancipation Proclamation","Gettysburg Address","Monroe Doctrine"],"例如《独立宣言》《邦联条例》《联邦党人文集》《五月花号公约》等。","最好记的答案就是“独立宣言” Declaration of Independence，前面已经背过了，直接拿来用！"],
[15,"⚖️","There are three branches of government. Why?","政府为什么有三个分支？",["So one part does not become too powerful","Checks and balances","Separation of powers"],["So the president can rule alone","To save money","Because there are three big states"],"三权分立、相互制衡，防止某一方权力过大。","三权分立防止一家独大：So one part does not become too powerful。关键词 powerful（权力大）。"],
[16,"🏛️","Name the three branches of government.","说出政府的三个分支。",["Legislative, executive, and judicial","Congress, president, and the courts"],["Army, navy, and air force","Federal, state, and local","Senate, House, and Cabinet"],"立法（国会）、行政（总统）、司法（法院）。","三兄弟：Congress 国会（立法）、President 总统（行政）、Courts 法院（司法）。口诀“会、总、院”。"],
[17,"🦅","The President of the United States is in charge of which branch of government?","美国总统领导哪个政府分支？",["Executive branch"],["Legislative branch","Judicial branch","State branch"],"总统领导行政分支，负责执行法律。","总统 = 执行（execute）→ Executive branch。公司里 CEO 的 E 就是 Executive！"],
[18,"✍️","What part of the federal government writes laws?","联邦政府中哪个部门制定法律？",["(U.S.) Congress","(U.S. or national) legislature","Legislative branch"],["The President","The Supreme Court","The Cabinet"],"国会（立法分支）写法律。","写法律的是 Congress（国会）。联想 “con-gress 一起开大会”，类似咱们的“全国人大”。"],
[19,"🏛️","What are the two parts of the U.S. Congress?","美国国会由哪两部分组成？",["Senate and House (of Representatives)"],["President and Cabinet","Supreme Court and federal courts","Democrats and Republicans"],"参议院 + 众议院。","国会两院：Senate（参议院，“参”谐音 Sen）+ House（众议院，人多像住一大房子 house）。"],
[20,"🔨","Name one power of the U.S. Congress.","说出美国国会的一项权力。",["Writes laws","Declares war","Makes the federal budget"],["Vetoes bills","Appoints federal judges","Is Commander in Chief"],"国会：立法、宣战、制定联邦预算。","国会最主要的权力就是写法律：Writes laws。前一题刚背过“国会写法律”，一模一样！"],
[21,"💯","How many U.S. senators are there?","美国有多少名参议员？",["One hundred (100)"],["Fifty (50)","Four hundred thirty-five (435)","Twenty-seven (27)"],"50个州 × 每州2名 = 100名。","参议员 = 50 个州 × 每州 2 人 = One hundred（100）。好比“百人团”。"],
[22,"6️⃣","How long is a term for a U.S. senator?","参议员任期多长？",["Six (6) years"],["Two (2) years","Four (4) years","For life"],"参议员任期6年。","任期口诀“众二总四参六”：参议员 6 年 → Six years。"],
[23,"🗺️","Who is one of your state’s U.S. senators now?","你所在州目前的一位联邦参议员是谁？",["Rick Scott","Ashley Moody"],["Marco Rubio","Bill Nelson","Byron Donalds"],"佛罗里达州的两位联邦参议员是 Rick Scott 和 Ashley Moody（据 senate.gov，2026年10月核对）。⚠️ 会变：2026年11月3日佛州有参议员特别选举（Moody 的席位），面试前请再查 senate.gov。","佛州两位参议员：Rick Scott + Ashley Moody。记“斯科特（Scott）开车，穆迪（Moody）心情好”——阳光州的好心情。答一个即可。"],
[24,"🔢","How many voting members are in the House of Representatives?","众议院有多少名有投票权的议员？",["Four hundred thirty-five (435)"],["One hundred (100)","Fifty (50)","Five hundred (500)"],"众议院有435名有投票权议员。","众议院 435 人：“四(4)季三(3)餐五(5)谷丰”——一年四季、一日三餐、五谷丰登，人多才热闹！英文 Four hundred thirty-five。"],
[25,"2️⃣","How long is a term for a member of the House of Representatives?","众议员任期多长？",["Two (2) years"],["Four (4) years","Six (6) years","Eight (8) years"],"众议员任期2年。","“众二总四参六”：众议员 2 年 → Two years。任期最短，两年一选。"],
[26,"📊","Why do U.S. representatives serve shorter terms than U.S. senators?","为什么众议员的任期比参议员短？",["To more closely follow public opinion"],["To save money","Because they are younger","Because the president decides"],"任期短、选得勤，更能紧跟民意。","任期短 = 常常回家听意见 → To more closely follow public opinion。opinion 谐音“哦屁宁”= 意见。"],
[27,"✌️","How many senators does each state have?","每个州有几名参议员？",["Two (2)"],["One (1)","Four (4)","It depends on population"],"每个州2名，不论大小。","每州参议员 2 人（不论大小）→ Two。大州加州、小州罗德岛都一样。"],
[28,"🤝","Why does each state have two senators?","为什么每个州都有两名参议员？",["Equal representation (for small states)","The Great Compromise (Connecticut Compromise)"],["Because of population","Because the president decides","To make Congress bigger"],"让小州也有平等代表权，这来自“大妥协（康涅狄格妥协）”。","小州也要平等发言：Equal representation。equal = 平等，像“一碗水端平”。"],
[29,"🧑‍💼","Name your U.S. representative.","说出你的联邦众议员的名字。",["Answers will vary (name your U.S. representative)"],["The Vice President","The Chief Justice","The Secretary of State"],"答案因选区而异；海外领地居民可说出非投票代表，或说没有投票权代表。可在 house.gov 查询。","众议员按选区不同——上 house.gov 输入邮编查到后填一次，以后照卡片背。representative 谐音“瑞普瑞森特”。"],
[30,"🎙️","What is the name of the Speaker of the House of Representatives now?","现任众议院议长叫什么名字？",["Mike Johnson","Johnson","James Michael Johnson"],["John Roberts","JD Vance","Chuck Schumer"],"根据 USCIS 更新页（截至核对时）：Mike Johnson。⚠️ 会变：这个答案会随选举/任命改变，面试前请再查 uscis.gov/citizenship/testupdates。","众议院议长：Mike Johnson。想象“迈克·强生”在 House 里拿着议长小锤。"],
[31,"🗺️","Who does a U.S. senator represent?","联邦参议员代表谁？",["Citizens of their state","People of their state"],["Only their political party","The president","People of one city"],"参议员代表整个州的人民。","参议员代表“整个州”：People of their state。state = 州。"],
[32,"🗳️","Who elects U.S. senators?","谁选举联邦参议员？",["Citizens from their state"],["The president","The governor","Congress"],"由本州公民选举。","谁选参议员？本州公民：Citizens from their state。和上一题同一套词：state。"],

function makeCard(n,mode){const q=QM[n];let type=TYPE[n];
 const c={n,mode,type,done:false,ok:null,en:{}};
 if(type==='single'){c.right=CLEAN[n]||pick(q.a);c.opts=shuffle([c.right,...q.w]);c.picked=null;c.ans=[c.right]}
 else if(type==='multi'){const need=NEED(q.q);const k=Math.min(q.a.length,Math.max(need,3));const rs=shuffle(q.a).slice(0,k);c.need=need;c.rights=rs;c.opts=shuffle([...rs,...q.w]);c.sel=[];c.ans=rs}

 else if(type==='match'){const me=PEOPLE.find(p=>p[0]===n);const ps=[me,...shuffle(PEOPLE.filter(p=>p!==me)).slice(0,3)];c.L=ps.map(p=>p[1]);c.R=ps.map(deedOf);c.cover=ps.map(p=>p[0]);c.Rorder=shuffle([0,1,2,3]);c.pairs={};c.selL=null;c.ans=ps.map((p,i)=>p[1]+' – '+c.R[i])}
 else if(type==='map'){c.hs=HS[n];c.right=q.a.find(a=>HS[n].some(h=>h[0]===a));c.picked=null;c.ans=[c.right]}
 else {c.flipped=false;c.ans=q.a}
 return c}

function addReview(n){S.everRev=1;S.review[n]={c:0,due:Date.now()}}
function reviewList(){return Object.keys(S.review).map(Number).sort((a,b)=>S.review[a].due-S.review[b].due)}
function grade(ok){const c=S.card;if(c.done)return;c.done=true;c.ok=ok;S.seen=S.seen||{};(c.cover||[c.n]).forEach(m=>S.seen[m]=1);
 if(c.mode==='stop'){ok?S.stats.c++:S.stats.w++;if(!ok){(c.cover||[c.n]).forEach(addReview);S.queue.push(c.n)}}
 else if(c.mode==='review'){const r=S.review[c.n];if(r){if(ok){r.c++;r.due=Date.now()+(r.c===1?5*60e3:0);if(r.c>=2)delete S.review[c.n]}else{r.c=0;r.due=Date.now()+60e3}}}
 else if(c.mode==='exam'){ok?S.exam.c++:S.exam.w++;if(!ok)addReview(c.n)}
 upd()}

function pickSingle(i){const c=S.card;if(c.done)return;c.picked=i;grade(i>=0&&c.opts[i]===c.right)}
function unsure(){const c=S.card;if(c.type==='single'||c.type==='map')c.picked=-1;grade(false)}
function togSel(i){const c=S.card;if(c.done)return;const k=c.sel.indexOf(i);k<0?c.sel.push(i):c.sel.splice(k,1);upd()}
function confirmMulti(){const c=S.card;const wrong=c.sel.some(i=>!c.rights.includes(c.opts[i]));const good=c.sel.filter(i=>c.rights.includes(c.opts[i])).length;grade(!wrong&&good>=c.need)}
function tapL(i){const c=S.card;if(c.done)return;if(c.pairs[i]!==undefined){delete c.pairs[i];c.selL=null}else c.selL=c.selL===i?null:i;upd()}
function tapR(j){const c=S.card;if(c.done)return;for(const k in c.pairs)if(c.pairs[k]===j)delete c.pairs[k];if(c.selL!==null){c.pairs[c.selL]=j;c.selL=null}upd()}
function confirmMatch(){const c=S.card;grade([0,1,2,3].every(i=>c.pairs[i]===i))}
function pickMap(i){const c=S.card;if(c.done)return;c.picked=i;grade(c.hs[i][0]===c.right)}

/* bilingual helpers */
function txt(k){const c=S.card,q=QM[c.n];const m=/^([qx])(\d+)$/.exec(k);if(m){const p=QM[+m[2]];return m[1]==='q'?[p.z,p.q]:[p.x,(p.a.length>1?'Official accepted answers: ':'Official answer: ')+p.a.join(' / ')]}if(k==='q')return[q.z,q.q];if(k==='exp')return[q.x,(q.a.length>1?'Official accepted answers: ':'Official answer: ')+q.a.join(' / ')];return['','']}
function bi(k){const on=S.card.en[k],t=txt(k);return`<span class="tx">${esc(on?t[1]:t[0])}</span><span class="tg${on?' on':''}" role="button" aria-label="切换中英文" onclick="tg(event,'${k}')">${on?'中':'🔊 EN'}</span>`}
function tg(ev,k){ev.stopPropagation();const c=S.card;c.en[k]=!c.en[k];save();render();if(c.en[k])say(txt(k)[1]);else{try{speechSynthesis.cancel()}catch(e){}}}
const SPK=[];function sp(en){let i=SPK.indexOf(en);if(i<0){SPK.push(en);i=SPK.length-1}return`onclick="event.stopPropagation();say(SPK[${i}])"`}
function ot(en){return`<div class="ot" role="button" ${sp(en)}><div class="oen">${esc(en)} <span class="spk">🔊</span></div><div class="ozh">${esc(zh(en))}</div></div>`}
function row(cls,en,circle){return`<div class="btn opt ${cls}">${ot(en)}${circle}</div>`}
function circ(fn,cls,mark,label){return`<span class="rad ${cls}" role="button" aria-label="${label||'选择'}" onclick="${fn}">${mark||''}</span>`}
/* ---------- map ---------- */
function mapSVG(){const W=1000,H=620,cs=curStop();const P=STOPS.map(s=>[s[3][0]*W,s[3][1]*H]);
 let s=baseMap()+`<path d="M${P.slice(0,13).map(p=>p.join(',')).join(' L')}" fill="none" stroke="#9aa5b1" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/><path d="M${P[12]} L${P[13]} L${P[14]}" fill="none" stroke="#9aa5b1" stroke-width="4" stroke-dasharray="4 10"/>`;
 STOPS.forEach((st,i)=>{const[x,y]=P[i],d=S.done[st[0]],c=i===cs;s+=`<g onclick="tapStop(${i})" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${c?24:18}" fill="${d?'#1f7a4d':c?'#1d4e89':'#fff'}" stroke="${d?'#1f7a4d':'#1d4e89'}" stroke-width="4"/><text x="${x}" y="${y+7}" font-size="20" text-anchor="middle" fill="${d||c?'#fff':'#1d4e89'}" font-weight="700">${d?'✓':i+1}</text></g>`});
 const[cx,cy]=P[cs];return s+`<text x="${cx}" y="${cy-30}" font-size="46" text-anchor="middle">🚗</text></svg>`}
function baseMap(){return`<svg viewBox="0 0 1000 620" width="100%" role="img" aria-label="美国地图" style="background:#e8f1f8;border-radius:18px">
 <path d="M60,170 L150,120 L330,110 L560,120 L700,130 L800,150 L880,110 L930,150 L900,230 L850,300 L800,380 L790,450 L720,520 L760,560 L780,600 L740,590 L700,540 L640,560 L560,500 L500,520 L470,580 L430,520 L360,470 L290,450 L200,420 L110,370 L60,280 Z" fill="#f7f3e6" stroke="#c9bfa5" stroke-width="3"/>
 <rect x="40" y="500" width="160" height="100" rx="12" fill="#f7f3e6" stroke="#c9bfa5" stroke-width="2"/><text x="120" y="525" font-size="18" text-anchor="middle" fill="#888">阿拉斯加</text>
 <rect x="215" y="540" width="120" height="70" rx="12" fill="#f7f3e6" stroke="#c9bfa5" stroke-width="2"/><text x="275" y="562" font-size="18" text-anchor="middle" fill="#888">夏威夷</text>`}
function tapStop(i){if(!unlocked(i)){alert('先完成前一站，才能开往这里哦 🚗');return}startStop(i)}
/* ---------- format bodies ---------- */
function body(){const c=S.card,q=QM[c.n],D=c.done;let h='';
 if(c.type==='single'){h=c.opts.map((o,i)=>{let cl='';if(D){if(o===c.right)cl='ok';else if(i===c.picked)cl='bad';else cl='dim'}const sel=D&&i===c.picked;return row(cl,o,circ(`pickSingle(${i})`,sel?'f':'',sel?(o===c.right?'✓':'✗'):''))}).join('')}
 else if(c.type==='multi'){h=`<div class="hint">☑️ 选出所有正确答案（至少答对 ${c.need} 个），再点“确定”</div>`+c.opts.map((o,i)=>{const s=c.sel.includes(i),r=c.rights.includes(o);let cl='';if(D){if(r)cl=s?'ok':'miss';else if(s)cl='bad'}return row(cl,o,circ(`togSel(${i})`,'sq'+(s?' f':''),s?'✓':'','勾选'))+(D&&r&&!s?'':'')}).join('')+(D?'':`<button class="btn pri" onclick="confirmMulti()" ${c.sel.length?'':'disabled style="opacity:.5"'}>确定（已选 ${c.sel.length}）</button>`)}
 else if(c.type==='match'){const used=Object.values(c.pairs);h=`<div class="lbl">人物</div>`+c.L.map((n,i)=>{const p=c.pairs[i];let cl=c.selL===i?'cur':'';if(D)cl=p===i?'ok':'bad';return row(cl,n,circ(`tapL(${i})`,(p!==undefined||c.selL===i)?'f':'',p!==undefined?p+1+'':c.selL===i?'•':''))}).join('')+`<div class="lbl">做过的事</div>`+c.Rorder.map(j=>{let cl=used.includes(j)?'':'';if(D)cl='';return row(cl,c.R[j],circ(`tapR(${j})`,used.includes(j)?'f':'',used.includes(j)?j+1+'':''))}).join('')+(D?`<div class="card"><div class="lbl">正确配对</div>${c.L.map((n,i)=>`<div class="tl">✅ ${esc(n)}（${esc(zh(n))}）→ ${esc(c.R[i])}<br><span class="ozh">${esc(zh(c.R[i]))}</span></div>`).join('')}</div>`:`<button class="btn pri" onclick="confirmMatch()" ${Object.keys(c.pairs).length===4?'':'disabled style="opacity:.5"'}>确定配对</button>`)}
 else if(c.type==='map'){h=`<div class="hint">🗺️ 在地图上点选正确的位置</div><div class="card" style="padding:8px">${baseMap()}${c.hs.map((s,i)=>{const sel=c.picked===i,r=s[0]===c.right;const fill=D?(r?'#1f7a4d':sel?'#b42318':'#fff'):sel?'#1d4e89':'#fff';return`<g onclick="pickMap(${i})" style="cursor:pointer"><circle cx="${s[2]}" cy="${s[3]}" r="46" fill="transparent"/><circle cx="${s[2]}" cy="${s[3]}" r="34" fill="${fill}" stroke="#1d4e89" stroke-width="5"/><text x="${s[2]}" y="${s[3]+10}" font-size="30" font-weight="800" text-anchor="middle" fill="${fill==='#fff'?'#1d4e89':'#fff'}">${i+1}</text></g>`}).join('')}</svg></div>`+c.hs.map((s,i)=>{let cl='';if(D){if(s[0]===c.right)cl='ok';else if(i===c.picked)cl='bad'}return`<div class="btn opt ${cl}"><span class="num">${i+1}</span>${ot(s[0])}${circ(`pickMap(${i})`,c.picked===i?'f':'',c.picked===i?(s[0]===c.right?'✓':'✗'):'')}</div>`}).join('')}
 else if(c.type==='personal'){if(!S.profile||!S.profile.rep||S.editProfile)return profileForm();const a=personalAns(c.n);
  h=`<div class="card"><div class="lbl">我的众议员 · Florida</div>${a.length?a.map(ot).join(''):'<p class="sub">还没填写，点下面“修改”补上。</p>'}<button class="chip" style="margin-top:8px" onclick="S.editProfile=true;upd()">✏️ 修改</button></div>`+`<button class="btn pri" onclick="next()">下一题 →</button>`}
 return h}
function feedback(){const c=S.card,q=QM[c.n];
 if(c.cover)return`<div class="card"><div style="font-size:20px;font-weight:700;color:${c.ok?'var(--ok)':'var(--bad)'}">${c.ok?'全部正确！👍':'没关系，已加入错题本'}</div></div><h2>本组包含的官方题目</h2>`+c.cover.map(n=>{const p=QM[n];return`<div class="card"><div class="sub">#${n}</div><div class="bi qtx">${bi('q'+n)}</div><div class="lbl">官方答案</div>${p.a.map(ot).join('')}<div class="bi exp">${bi('x'+n)}</div><div class="tip">💡 ${esc(p.t)}</div></div>`}).join('')+(c.mode!=='exam'?`<button class="btn ghost" onclick="zhan()">⚔️ 斩（这 ${c.cover.length} 题都会了）</button>`:'')+`<button class="btn pri" onclick="next()">下一题 →</button>`;const self=c.type==='personal';
 const msg=self?(c.ok?'很好，记住了！👍':'已加入错题本，之后再复习'):(c.ok?'答对了！👍':'没关系，已加入错题本');
 return`<div class="card"><div style="font-size:20px;font-weight:700;color:${c.ok?'var(--ok)':'var(--bad)'}">${msg}</div>
 ${!self&&c.type!=='match'&&c.type!=='single'?`<div class="lbl">正确答案</div>${c.ans.map(ot).join('')}`:''}
 ${q.x.length>24||q.x.includes('⚠️')?`<div class="lbl">解释</div><div class="bi exp">${bi('exp')}</div>`:''}
 <div class="tip">💡 记忆小窍门：${esc(q.t)}</div></div><button class="btn pri" onclick="next()">下一题 →</button>`}
/* ---------- screens ---------- */
function render(){SPK.length=0;const sc=S.screen;let h='';
 const nRev=Object.keys(S.review).length,nKnown=Object.keys(S.known).length,nDone=Object.keys(S.done).length;
 if(sc==='home'){const cs=curStop();
  h=`<div class="home"><div class="emo" style="font-size:64px;text-align:center">🇺🇸🚗</div><h1 style="text-align:center;font-size:34px">绿卡公路之旅</h1>
  <div class="sub" style="text-align:center;font-size:18px">已学 ${nKnown+Object.keys(S.seen||{}).filter(n=>!S.known[n]).length}/128 题 · 当前：${STOPS[cs][1]}</div>
  <button class="hbtn learn" onclick="learn()"><span>📖</span><b>学习</b><small>${S.queue?'接着上次继续':'从第 1 站开始'}</small></button>
  <button class="hbtn rev" onclick="review()"><span>📒</span><b>复习 · ${nRev} 题</b><small>错题本</small></button></div>`}
 else if(sc==='map'){const cs=curStop();
  h=`<div class="top"><button class="chip" onclick="go('home')">← 首页</button></div><h1>🇺🇸 绿卡公路之旅</h1><div class="sub">美国入籍公民考试 · 2025版官方128题 · 一路开车一路学</div>
  <div class="card" style="padding:10px">${mapSVG()}</div>
  <div class="bar"><i style="width:${nDone/STOPS.length*100}%"></i></div><div class="sub" style="margin-top:4px">已完成 ${nDone}/${STOPS.length} 站 · 已斩 ${nKnown} 题 · 错题本 ${nRev} 题</div>
  <button class="btn pri" onclick="tapStop(${cs})">${nDone===STOPS.length?'🎉 全程完成！再逛一次':'🚗 继续出发：第'+(cs+1)+'站 '+STOPS[cs][1]}</button>
  ${S.card&&S.screen!=='q'?'':''}
  ${S.card&&S.card.mode==='stop'?`<button class="btn ghost" onclick="go('q')">↩️ 回到刚才那道题</button>`:''}
  <h2 style="margin-top:16px">路线</h2>`+STOPS.map((s,i)=>`<div class="stop ${i===cs?'cur':''} ${unlocked(i)?'':'lock'}" onclick="tapStop(${i})"><span style="font-size:30px">${S.done[s[0]]?'✅':unlocked(i)?s[4]:'🔒'}</span><span style="flex:1"><b>${i+1}. ${s[1]}</b><br><span class="sub">${s[2]} · ${s[6].length} 题</span></span></div>`).join('')+
  `<p class="sub">题目与答案来自 USCIS 官方《128 Civics Questions and Answers (2025 version)》。人名类答案会随选举变化，面试前请查 uscis.gov/citizenship/testupdates。</p>
  <button class="btn ghost" onclick="if(confirm('确定清空全部进度？'))reset()">重新开始</button>`}
 else if(sc==='intro'){const s=STOPS[S.stop];h=`<div class="top"><button class="chip" onclick="go('map')">← 地图</button><span class="tag">第 ${S.stop+1} 站</span></div>
  <div class="card" style="text-align:center"><div class="emo">${s[4]}</div><h1>${s[1]}</h1><div class="sub">${s[2]}</div><p style="text-align:left;font-size:20px">${s[5]}</p><p class="sub">本站 ${s[6].length} 题${S.queue.length<s[6].length?'（已斩 '+(s[6].length-S.queue.length)+' 题）':''}</p>
  <button class="btn pri" onclick="nextInStop()">开始答题</button></div>`}
 else if(sc==='q'&&S.card){const c=S.card,q=QM[c.n];
  let head=c.mode==='stop'?`${STOPS[S.stop][1]} · ${Math.min(S.qi+1,S.queue.length)}/${S.queue.length}`:c.mode==='review'?`📒 错题本 · 还剩 ${nRev} 题`:`📝 模拟考 第 ${S.exam.i+1} 题 · 对 ${S.exam.c} / 错 ${S.exam.w}`;
  const showUnsure=!c.done&&['single','map','multi','match'].includes(c.type);
  h=`<div class="top">${c.mode==='review'?`<button class="chip" onclick="go('home')">← 首页</button>`:`<button class="chip" onclick="go('map')">← 地图</button>`}<span class="sub" style="text-align:right">${head}</span></div>
  ${c.cover?`<div class="card"><h1 style="margin:0">🔗 连线配对</h1><p style="font-size:19px;margin:8px 0">把人物和他/她做过的事连起来：先点人物的圆圈，再点对应事情的圆圈</p><div class="sub">包含第 ${c.cover.join('、')} 题</div></div>`:`<div class="card"><div class="top"><span class="tag">${TNAME[c.type]} · #${c.n}</span>${c.mode!=='exam'?`<button class="chip" onclick="zhan()">⚔️ 斩（已会）</button>`:''}</div><div class="emo">${q.e}</div><div class="bi qtx">${bi('q')}</div></div>`}`+body()+
  (c.done?feedback():showUnsure?`<button class="btn ghost" onclick="unsure()">🤔 不确定，看答案</button>`:'')}
 else if(sc==='stopdone'){const s=STOPS[S.stop],last=S.stop===STOPS.length-1;h=`<div class="card" style="text-align:center"><div class="emo">🎉</div><h1>${s[1]} 完成！</h1>
  <p>${last?'恭喜你走完了整个美国！🇺🇸 继续用错题本和模拟考巩固吧。':'下一站：'+STOPS[S.stop+1][4]+' '+STOPS[S.stop+1][1]}</p>
  ${last?'':`<button class="btn pri" onclick="startStop(${S.stop+1})">🚗 开往下一站</button>`}<button class="btn ghost" onclick="go('map')">回到地图</button></div>`}
 else if(sc==='reviewdone'){h=`<div class="card" style="text-align:center"><div class="emo">📒</div><h1>${S.everRev?'错题本清空啦！🎉':'还没有错题'}</h1><p style="font-size:20px">${S.everRev?'太棒了，错题都复习过关了。':'学习时答错的题会自动放到这里。'}</p><p class="sub">每道错题要连续答对 2 次才会移出。</p><button class="btn pri" onclick="learn()">📖 去学习</button><button class="btn ghost" onclick="go('home')">回到首页</button></div>`}
 else if(sc==='examintro'){h=`<div class="top"><button class="chip" onclick="go('map')">← 地图</button></div><div class="card"><div class="emo">📝</div><h1>模拟考试</h1>
  <p>和真实面试一样：从128题中随机抽最多 <b>20</b> 题，答对 <b>12</b> 题即通过，答错 <b>9</b> 题即不通过，达到其一就停止。</p>
  <button class="btn pri" onclick="startExam()">开始考试</button></div>`}
 else if(sc==='examdone'){const e=S.exam,p=e.c>=12;h=`<div class="card" style="text-align:center"><div class="emo">${p?'🏅':'💪'}</div><h1>${p?'通过！':'还差一点'}</h1><div class="big">${e.c} 对 / ${e.w} 错</div>
  <p class="sub">${p?'达到12题正确，按官方规则通过。':'没答对的题已加入错题本，复习后再来！'}</p><button class="btn pri" onclick="startExam()">再考一次</button><button class="btn ghost" onclick="go('map')">回到地图</button></div>`}
 else{S.screen='home';return render()}
 $.innerHTML=h;layout(sc)}
function layout(sc){const kids=[...$.children];const hd=document.createElement('div'),sc2=document.createElement('div'),ft=document.createElement('div');hd.className='hd';sc2.className='sc';ft.className='ft';
 if(kids[0]&&kids[0].classList.contains('top'))hd.appendChild(kids.shift());
 const tail=[];if(sc!=='map'&&sc!=='home')while(kids.length&&tail.length<2&&kids[kids.length-1].matches('button.btn')){tail.unshift(kids.pop())}
 kids.forEach(k=>sc2.appendChild(k));tail.forEach(k=>ft.appendChild(k));$.innerHTML='';if(hd.children.length)$.appendChild(hd);$.appendChild(sc2);if(tail.length)$.appendChild(ft);$.className=(tail.length?'':'noft ')+(sc==='q'?'qs'+(S.card&&S.card.done?' dn':''):'');if(sc==='home')sc2.style.display='flex'}
function reset(){S=def();save();render()}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script></body></html>
